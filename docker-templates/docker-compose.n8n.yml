# docker-compose.n8n.yml

# Creates a n8n environment with Garage (S3-compatible) persistence and a static form frontend
# Needs a traefik container running in the `traefik-public` network
# See docker-compose.traefik-proxy.yml in this folder

# Required .env variables:
#   DOMAIN_NAME                       - domain, which is used for this environment (e.g. example.com)
#   SUBDOMAIN                         - subdomain, where n8n is reachable (e.g. n8n)
#   SUBDOMAIN_WEBHOOK                 - subdomain, where the n8n webhooks are reachable
#   SUBDOMAIN_PREPROCESSING_FORM      - subdomain, where the preprocessing form is served (e.g. form)
#   SUBDOMAIN_INFERENCE_FORM          - subdomain, where the inference forms are served (e.g. inference)
#   ENCRYPTION_KEY                    - key to encrypt the n8n content (use `openssl rand -hex 32`)
#   GENERIC_TIMEZONE                  - define timezone of the n8n environment (e.g. Europe/Berlin)
#   GARAGE_RPC_SECRET                 - secret for Garage's internal RPC protocol (use `openssl rand -hex 32`)
#   GARAGE_ADMIN_TOKEN                - bearer token for Garage's admin API (use `openssl rand -base64 32`)
#   GARAGE_METRICS_TOKEN              - bearer token for Garage's metrics endpoint (use `openssl rand -base64 32`)
#   GARAGE_ACCESS_KEY                 - S3 access key ID other services use to talk to Garage
#   GARAGE_SECRET_KEY                 - S3 secret access key other services use to talk to Garage (use `openssl rand -hex 32`)
#   BUCKET_NAME                       - name of the created bucket (will be created if missing)
#   FRONTEND_PREPROCESSING_DOCKERFILE - build context for the preprocessing form
#   FRONTEND_INFERENCE_DOCKERFILE     - build context for the inference forms
#
# Self-hosted outbound mail is optional, not part of this file — see
# docker-compose.mailserver.yml (and ../README.md for non-self-hosted alternatives).
#
# Garage has no public Traefik route — it's reachable two ways, both internal-only:
#
# 1. S3 API (SigV4-authenticated) from any container on `traefik-public`, e.g. n8n's
#    S3 nodes: http://garage:3900/${BUCKET_NAME}/<key> — configure the node with
#    GARAGE_ACCESS_KEY/GARAGE_SECRET_KEY, region "garage", force-path-style.
#
# 2. Anonymous GET, for services that only take a plain URL (e.g. an external
#    preprocessing API fetching an uploaded file server-side, with no way to pass S3
#    credentials). Garage's anonymous access is Host-header-routed, not path-style, so
#    garage carries an alias on `preprocess-network` — a network shared with whichever
#    other compose stack needs this (create it once: `docker network create
#    preprocess-network`, and have that stack join it, same pattern as
#    docker-compose.n8n.local.yml's README section) — matching its `[s3_web] root_domain`
#    below. Any container on that network can then plain-GET:
#      http://${BUCKET_NAME}.web.garage.internal:3902/<key>
#    The garage-public-access-init service below enables this automatically on first boot.

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      # --- Public URL (required for forms & webhooks) ---
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${SUBDOMAIN_WEBHOOK}.${DOMAIN_NAME}/
      - N8N_DEFAULT_CORS=TRUE
      - N8N_CORS_ALLOW_ORIGIN=https://${SUBDOMAIN}.${DOMAIN_NAME},https://${SUBDOMAIN_WEBHOOK}.${DOMAIN_NAME},https://${SUBDOMAIN_PREPROCESSING_FORM}.${DOMAIN_NAME},https://${SUBDOMAIN_INFERENCE_FORM}.${DOMAIN_NAME}

      # --- Security ---
      - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true

      # --- Admin ---
      - N8N_USER_MANAGEMENT_DISABLED=false
      - NODE_ENV=production
      - N8N_PAYLOAD_SIZE_MAX=128
      - N8N_TRUST_PROXY=true

      # --- Timezone ---
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./local-files:/files
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls.certresolver=letsencrypt
      - traefik.http.services.n8n.loadbalancer.server.port=5678

      - traefik.http.routers.n8n-webhook.rule=Host(`${SUBDOMAIN_WEBHOOK}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n-webhook.entrypoints=websecure
      - traefik.http.routers.n8n-webhook.tls.certresolver=letsencrypt

      - traefik.http.middlewares.n8n.headers.sslredirect=true
      - traefik.http.middlewares.n8n.headers.stsseconds=315360000
      - traefik.http.middlewares.n8n.headers.browserxssfilter=true
      - traefik.http.middlewares.n8n.headers.contenttypenosniff=true
      - traefik.http.middlewares.n8n.headers.forcestsheader=true
      - traefik.http.middlewares.n8n.headers.sslhost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.stsincludesubdomains=true
      - traefik.http.middlewares.n8n.headers.stspreload=true

      - traefik.http.routers.n8n.middlewares=n8n@docker

      # CORS middleware
      - traefik.http.middlewares.n8n-cors.headers.accesscontrolalloworiginlist=*
      - traefik.http.middlewares.n8n-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS
      - traefik.http.middlewares.n8n-cors.headers.accesscontrolallowheaders=*
      - traefik.http.middlewares.n8n-cors.headers.accesscontrolmaxage=3600
      - traefik.http.routers.n8n-webhook.service=n8n
      - traefik.http.routers.n8n-webhook.middlewares=n8n-cors@docker

    networks:
      - traefik-public

  # Single binary, single container: `--single-node --default-bucket` makes Garage
  # assign its own cluster layout and create BUCKET_NAME + an access key with
  # read/write on it at first boot — no separate container needed for that part. The
  # image is `FROM scratch` (no shell/curl inside), which is also why config is
  # injected via the `configs:` block below instead of a templated entrypoint script,
  # and why there's no Docker healthcheck here.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    restart: unless-stopped
    command: [ "/garage", "server", "--single-node", "--default-bucket" ]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${BUCKET_NAME}
    configs:
      - source: garage_toml
        target: /etc/garage.toml
    volumes:
      - garage-data:/data
    networks:
      traefik-public: {}
      # Lets containers in other compose stacks (e.g. a preprocessing API) reach
      # BUCKET_NAME anonymously via the website endpoint — see header comment above.
      preprocess-network:
        aliases:
          - ${BUCKET_NAME}.web.garage.internal

  # Unlike bucket creation, enabling anonymous website access has no boot-time flag —
  # it's only reachable via the `bucket website --allow` CLI call against a *running*
  # server. `network_mode: service:garage` shares garage's network namespace so this
  # can reach it at 127.0.0.1 (same trick as `docker exec garage ...` would, just
  # automatic). It also needs the same garage-data volume: the CLI reads its node key
  # from metadata_dir, which `network_mode` alone doesn't share (only the network
  # stack, not the filesystem) — mounting the same volume just lets it see the key the
  # running server already generated there, nothing writes to it concurrently.
  # `restart: on-failure` retries until garage's RPC is actually up, then this exits 0
  # for good — idempotent, so re-running it on every `up` is harmless.
  garage-public-access-init:
    image: dxflrs/garage:v2.3.0
    container_name: garage-public-access-init
    command: [ "/garage", "bucket", "website", "--allow", "${BUCKET_NAME}" ]
    configs:
      - source: garage_toml
        target: /etc/garage.toml
    volumes:
      - garage-data:/data
    network_mode: "service:garage"
    depends_on:
      - garage
    restart: on-failure

  # ── Preprocessing form (static HTML, belongs to n8n stack) ───────────
  preprocessing-form:
    build:
      context: ${FRONTEND_PREPROCESSING_DOCKERFILE}
      dockerfile: frontend-preprocessing-form/Dockerfile
    container_name: preprocessing-form
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.preprocessing-form.rule=Host(`${SUBDOMAIN_PREPROCESSING_FORM}.${DOMAIN_NAME}`)
      - traefik.http.routers.preprocessing-form.entrypoints=websecure
      - traefik.http.routers.preprocessing-form.tls.certresolver=letsencrypt
      - traefik.http.services.preprocessing-form.loadbalancer.server.port=80
    networks:
      - traefik-public

  inference-form:
    build:
      context: ${FRONTEND_INFERENCE_DOCKERFILE}
      dockerfile: frontend-inference-forms/Dockerfile
    container_name: inference-form
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.inference-form.rule=Host(`${SUBDOMAIN_INFERENCE_FORM}.${DOMAIN_NAME}`)
      - traefik.http.routers.inference-form.entrypoints=websecure
      - traefik.http.routers.inference-form.tls.certresolver=letsencrypt
      - traefik.http.services.inference-form.loadbalancer.server.port=80
    networks:
      - traefik-public

# ── Volumes ──────────────────────────────────────────────────────────
volumes:
  n8n-data:
    driver: local
  garage-data:

# ── Networks ─────────────────────────────────────────────────────────
networks:
  traefik-public:
    external: true
  # Shared with other compose stacks that need anonymous access to garage's bucket
  # (e.g. a preprocessing API) — see the garage service and header comment above.
  preprocess-network:
    external: true

# ── Configs ──────────────────────────────────────────────────────────
# Rendered from .env at `docker compose config`/`up` time and mounted read-only
# into the garage container — the image has no shell to template this itself.
configs:
  garage_toml:
    content: |
      metadata_dir = "/data/meta"
      data_dir = "/data/data"
      db_engine = "sqlite"

      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "${GARAGE_RPC_SECRET}"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

      [s3_web]
      bind_addr = "[::]:3902"
      root_domain = ".web.garage.internal"
      index = "index.html"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token = "${GARAGE_ADMIN_TOKEN}"
      metrics_token = "${GARAGE_METRICS_TOKEN}"
