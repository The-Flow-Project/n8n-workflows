# docker-compose.n8n.local.yml
#
# LOCAL / no-domain variant of docker-compose.n8n.yml.
# Reach every service by the server's LAN IP over plain HTTP — no domain, no
# subdomains, no Traefik, no TLS. Intended for a trusted internal network.
#
#   n8n            -> http://<SERVER_IP>:5678
#   forms (all)    -> http://<SERVER_IP>/         (landing menu + /workflows-*/ sub-paths)
#
# This file does NOT replace the domain-based stack — run whichever you need:
#   domain : docker compose -f docker-templates/docker-compose.n8n.yml up -d   (needs Traefik)
#   local  : docker compose -f docker-templates/docker-compose.n8n.local.yml up -d
#
# Required .env variables: see docker-templates/.env.local.example
#   SERVER_IP, ENCRYPTION_KEY, GENERIC_TIMEZONE, GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN,
#   GARAGE_METRICS_TOKEN, GARAGE_ACCESS_KEY, GARAGE_SECRET_KEY, BUCKET_NAME
#
# Self-hosted outbound mail is optional, not part of this file — see
# docker-compose.mailserver.local.yml (and ../README.md for non-self-hosted alternatives).
#
# Garage is internal-only, reachable two ways — see docker-compose.n8n.yml's header
# comment for the full explanation:
#   1. S3 API (SigV4-authenticated): http://garage:3900/${BUCKET_NAME}/<key>
#   2. Anonymous GET via the website endpoint, for services that only take a plain URL
#      (e.g. a preprocessing API on `preprocess-network` fetching an uploaded file):
#      http://${BUCKET_NAME}.web.garage.internal:3902/<key>
#      The garage-public-access-init service below enables this automatically on first boot.

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # --- Public URL: the LAN IP the browser actually uses ---
      - N8N_HOST=${SERVER_IP}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # over plain HTTP n8n's secure-only cookie is dropped by the browser,
      # which logs you straight back out. Must be false for non-HTTPS access.
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://${SERVER_IP}:5678/
      - N8N_DEFAULT_CORS=TRUE
      - N8N_CORS_ALLOW_ORIGIN=http://${SERVER_IP}

      # --- Security ---
      - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true

      # --- Admin ---
      - N8N_USER_MANAGEMENT_DISABLED=false
      - NODE_ENV=production
      - N8N_PAYLOAD_SIZE_MAX=128
      - N8N_TRUST_PROXY=true
      - N8N_METRICS=true
      - QUEUE_HEALTH_CHECK_ACTIVE=true

      # --- Timezone ---
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./local-files:/files
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - n8n-local
      - inference-network
      - preprocess-network

  # Single binary, single container: `--single-node --default-bucket` makes Garage
  # assign its own cluster layout and create BUCKET_NAME + an access key with
  # read/write on it at first boot — no separate container needed for that part. The
  # image is `FROM scratch` (no shell/curl inside), which is also why config is
  # injected via the `configs:` block below instead of a templated entrypoint script,
  # and why there's no Docker healthcheck here.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    restart: unless-stopped
    # no ports published: reachable only from other containers on n8n-local
    # (e.g. http://garage:3900 from n8n), not from outside the host.
    command: [ "/garage", "server", "--single-node", "--default-bucket" ]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${BUCKET_NAME}
    configs:
      - source: garage_toml
        target: /etc/garage.toml
    volumes:
      - garage-data:/data
    networks:
      n8n-local: {}
      # Lets containers in other compose stacks (e.g. a preprocessing API) reach
      # BUCKET_NAME anonymously via the website endpoint — see header comment above.
      preprocess-network:
        aliases:
          - ${BUCKET_NAME}.web.garage.internal

  # Unlike bucket creation, enabling anonymous website access has no boot-time flag —
  # it's only reachable via the `bucket website --allow` CLI call against a *running*
  # server. `network_mode: service:garage` shares garage's network namespace so this
  # can reach it at 127.0.0.1 (same trick as `docker exec garage ...` would, just
  # automatic). It also needs the same garage-data volume: the CLI reads its node key
  # from metadata_dir, which `network_mode` alone doesn't share (only the network
  # stack, not the filesystem) — mounting the same volume just lets it see the key the
  # running server already generated there, nothing writes to it concurrently.
  # `restart: on-failure` retries until garage's RPC is actually up, then this exits 0
  # for good — idempotent, so re-running it on every `up` is harmless.
  garage-public-access-init:
    image: dxflrs/garage:v2.3.0
    container_name: garage-public-access-init
    command: [ "/garage", "bucket", "website", "--allow", "${BUCKET_NAME}" ]
    configs:
      - source: garage_toml
        target: /etc/garage.toml
    volumes:
      - garage-data:/data
    network_mode: "service:garage"
    depends_on:
      - garage
    restart: on-failure

  # ── All forms behind one entry point (landing menu + /workflows-*/ sub-paths) ──
  forms:
    build:
      context: ..
      dockerfile: frontend-forms/Dockerfile
    container_name: forms
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # injected into /config.js at start; forms POST here from the browser,
      # so it must be the LAN-reachable n8n URL (not an internal docker name).
      - WEBHOOK_BASE_URL=http://${SERVER_IP}:5678
    networks:
      - n8n-local

# ── Volumes ──────────────────────────────────────────────────────────
volumes:
  n8n-data:
    external: true
    name: n8n_n8n-data
  garage-data:
    external: true
    name: n8n_garage-data


# ── Networks ─────────────────────────────────────────────────────────
# n8n-local = this stack's private bridge (created by compose).
# inference-network = shared network for local API containers in OTHER compose stacks;
# preprocess-network = shared network for local API containers in OTHER compose stacks.
# n8n joins it to call them by name. Create it once before `up`:
#   docker network create inference-network
#   docker network create preprocess-network
# and have each API stack join the same external network.
networks:
  n8n-local:
    driver: bridge
  inference-network:
    external: true
  preprocess-network:
    external: true

# ── Configs ──────────────────────────────────────────────────────────
# Rendered from .env at `docker compose config`/`up` time and mounted read-only
# into the garage container — the image has no shell to template this itself.
configs:
  garage_toml:
    content: |
      metadata_dir = "/data/meta"
      data_dir = "/data/data"
      db_engine = "sqlite"

      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "${GARAGE_RPC_SECRET}"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

      [s3_web]
      bind_addr = "[::]:3902"
      root_domain = ".web.garage.internal"
      index = "index.html"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token = "${GARAGE_ADMIN_TOKEN}"
      metrics_token = "${GARAGE_METRICS_TOKEN}"
